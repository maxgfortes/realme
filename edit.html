<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <script src="/src/shared/theme-boot.js"></script>
  <script src="/src/i18n/i18n-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RealMe</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./src/styles/shared/base.css">
  <link rel="stylesheet" href="./src/styles/pages/edit/edit.css">
  <link rel="stylesheet" href="./src/styles/shared/root.css">
  <link rel="icon" href="./public/img/icon.png" type="image/png">
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">

  <meta property="og:site_name" content="RealMe">
  <meta property="og:title" content="RealMe">
  <meta property="og:description" content="Conecte-se com amigos, conheça pessoas novas e compartilhe sua vida com as pessoas ao seu redor.">
  <meta property="og:url" content="https://socialrealme.com">
  <meta property="og:image" content="https://socialrealme.com/public/img/share-icon.png">
  <meta property="og:image:alt" content="Logo e identidade visual do RealMe">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RealMe">
  <meta name="twitter:description" content="Conecte-se com amigos, conheça pessoas novas e compartilhe sua vida com quem importa no RealMe.">
  <meta name="twitter:image" content="https://socialrealme.com/public/img/share-icon.png">
  <script type="module" src="/src/i18n/page.js"></script>
</head>
<body>

<div class="navbar-top">
  <div class="top-left">
    <button onclick="window.history.back()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298 511.93"><path d="M285.77 441c16.24 16.17 16.32 42.46.15 58.7-16.16 16.24-42.45 16.32-58.69.16l-215-214.47c-16.24-16.16-16.32-42.45-.15-58.69L227.23 12.08c16.24-16.17 42.53-16.09 58.69.15 16.17 16.24 16.09 42.54-.15 58.7l-185.5 185.04L285.77 441z"/></svg>
    </button>
  </div>
  <h2 data-i18n="edit.editar_perfil">Editar perfil</h2>
  <div class="top-right">
    <a>
      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.88 95.95"><g><path d="M8.94,0h105c4.92,0,8.94,4.02,8.94,8.94l0,0c0,4.92-4.02,8.94-8.94,8.94h-105C4.02,17.88,0,13.86,0,8.94l0,0C0,4.02,4.02,0,8.94,0L8.94,0z M8.94,78.07h105c4.92,0,8.94,4.02,8.94,8.94l0,0c0,4.92-4.02,8.94-8.94,8.94h-105C4.02,95.95,0,91.93,0,87.01l0,0C0,82.09,4.02,78.07,8.94,78.07L8.94,78.07z M8.94,39.03h105c4.92,0,8.94,4.02,8.94,8.94l0,0c0,4.92-4.02,8.94-8.94,8.94h-105C4.02,56.91,0,52.89,0,47.97l0,0C0,43.06,4.02,39.03,8.94,39.03L8.94,39.03z"/></g></svg>
    </a>
  </div>
</div>

<div class="page-container">
  <div class="media-area">
    <div class="pfp-container">
      <div class="pfp-area">
        <img src="../public/img/default.jpg" alt="pfp" class="pfp" data-i18n-attr="alt:edit.pfp">
      </div>
    </div>
    <div class="banner-container">
      <div class="banner-area">
        <img src="../public/img/bg.jpg" alt="banner" class="banner" data-i18n-attr="alt:edit.banner">
      </div>
    </div>
  </div>

  <div class="major-container">
    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="common.nome">Nome</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="name">
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="common.sobrenome">Sobrenome</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="surname">
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="edit.nome_de_usuario">Nome de usuario</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="username">
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="edit.pronomes">Pronomes</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="pronomes">
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="edit.bio">Bio</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="bio">
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="edit.genero">Genero</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <select class="label-input" id="genero">
            <option value="" data-i18n="edit.selecione">Selecione</option>
            <option value="Masculino" data-i18n="common.masculino">Masculino</option>
            <option value="Feminino" data-i18n="common.feminino">Feminino</option>
          </select>
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="common.localizacao">Localização</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="localizacao">
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left">
        <div class="label-title" data-i18n="edit.status_de_relacionamento">Status de relacionamento</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <select class="label-input" id="relacionamento">
            <option value="" data-i18n="edit.selecione">Selecione</option>
            <option value="Em Compromisso" data-i18n="edit.em_compromisso">Em Compromisso</option>
            <option value="Solteiro(a)" data-i18n="edit.solteiro_a">Solteiro(a)</option>
            <option value="Namorando" data-i18n="common.namorando">Namorando</option>
            <option value="Noivo(a)" data-i18n="edit.noivo_a">Noivo(a)</option>
            <option value="Casado(a)" data-i18n="edit.casado_a">Casado(a)</option>
            <option value="É Complicado" data-i18n="edit.e_complicado">É Complicado</option>
          </select>
        </div>
      </div>
    </div>

    <div class="label-container">
      <div class="label-left last">
        <div class="label-title" data-i18n="common.musica">Musica</div>
      </div>
      <div class="label-rigth">
        <div class="label-input-area">
          <input type="text" class="label-input" id="musica" placeholder="Cole uma URL do youtube" data-i18n-attr="placeholder:edit.cole_uma_url_do_youtube">
        </div>
      </div>
    </div>
  </div>

  <div class="major-container link" id="links-container">
    <div class="config-title" id="links-toggle" data-i18n="edit.links">Links</div>
    <div class="links-list">
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fa-brands fa-instagram"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.instagram_com">instagram.com/</span>
            <input type="text" class="label-input" data-link="instagram" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fa-brands fa-x-twitter"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.x_com">x.com/</span>
            <input type="text" class="label-input" data-link="x" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-spotify"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.open_spotify_com_user">open.spotify.com/user/</span>
            <input type="text" class="label-input" data-link="spotify" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-tiktok"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.tiktok_com">tiktok.com/@</span>
            <input type="text" class="label-input" data-link="tiktok" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-pinterest"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.pinterest_com">pinterest.com/</span>
            <input type="text" class="label-input" data-link="pinterest" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fa-brands fa-reddit-alien"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.reddit_com_user">reddit.com/user/</span>
            <input type="text" class="label-input" data-link="reddit" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-facebook"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.facebook_com">facebook.com/</span>
            <input type="text" class="label-input" data-link="facebook" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-youtube"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span data-i18n="edit.youtube_com">youtube.com/@</span>
            <input type="text" class="label-input" data-link="youtube" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-discord"></i>
          </div>
        </div>
        <div class="label-rigth">
          <div class="label-input-area">
            <span>@</span>
            <input type="text" class="label-input" data-link="discord" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
      <div class="label-container">
        <div class="label-left link">
          <div class="label-title">
            <i class="fab fa-playstation"></i>
          </div>
        </div>
        <div class="label-rigth last">
          <div class="label-input-area last">
            <span>@</span>
            <input type="text" class="label-input" data-link="playstation" placeholder="username" data-i18n-attr="placeholder:edit.username">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="save-area">
    <button class="save-btn" data-i18n="edit.salvar">Salvar</button>
  </div>
</div>

<script type="module" src="./src/js/pages/edit/edit.js"></script>
</body>
</html>
