<div class="dm-chat-area" id="dmChatArea">

  <div class="dm-send-area">

      <textarea type="text" class="dmMsgInput" id="dmMsgInput" placeholder="Mensagem" autocomplete="off" maxlength="500"></textarea>
      <button class="dmSendBtn" id="dmSendBtn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" fill-rule="evenodd" clip-rule="evenodd" viewBox="0 0 404 511.5"><path fill-rule="nonzero" d="m219.24 72.97.54 438.53h-34.95l-.55-442.88L25.77 241.96 0 218.39 199.73 0 404 222.89l-25.77 23.58z" stroke-width="40" stroke-linejoin="round"/></svg>

<!-- Overlay Status -->
<div class="note-create-area" id="createNoteArea">
  <div class="note-create-overlay" id="createNoteOverlay"></div>
  <div class="feeling-create-modal" id="createNoteModal">
    <div class="user-header">
      <div class="pfp-modal-feeling">
        <img src="../public/img/default.jpg" alt="Foto de perfil" id="createNoteModalPfp">
      </div>
      <div class="user-info-modal-feeling">
        <div class="username-modal-feeling" id="createNoteModalName"></div>
      </div>
    </div>
    <div class="feelings-area">
      <textarea class="noteInput" name="note" id="noteInput" placeholder="Ocupado, estudando, trabalhando..."></textarea>
    </div>
    <div class="modal-feeling-btns">
      <button class="cancel-feeling-btn" id="cancelFeeling">Cancelar</button>
      <button class="send-feeling-btn" id="sendFeeling">Enviar</button>
    </div>
  </div>
</div>

<!-- Overlay Status -->

      <div class="pfp-modal-feeling">
        <img src="../public/img/default.jpg" alt="Foto de perfil" id="noteModalPfp">
      </div>
      <div class="user-info-modal-feeling">
        <div class="note-content-area" id="noteContent">
          <div class="note-content-name">Maximus Fortes está:</div>
          <div class="note-content">programando o RealMe</div>
        </div>
      </div>
    </div>
    <div class="note-view-actions">
      <input class="reply-note-input" type="text" id="replyNoteInput" placeholder="Responder Maximus Fortes...">
