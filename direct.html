<div class="dm-chat-area" id="dmChatArea">
  <div class="dm-chat-header" id="dmChatHeader">

<div class="note-create-area" id="createNoteArea">
  <div class="note-create-overlay" id="createNoteOverlay"></div>
  <div class="feeling-create-modal" id="createNoteModal">
    <div class="user-header">
      <div class="pfp-modal-feeling">
        <img src="./public/img/default.jpg" alt="Foto de perfil" id="createNoteModalPfp" data-i18n-attr="alt:direct.foto_de_perfil">
      </div>
      <div class="user-info-modal-feeling">
        <div class="username-modal-feeling" id="createNoteModalName"></div>
      </div>
    </div>
    <div class="feelings-area">
      <textarea class="noteInput" name="note" id="noteInput" placeholder="Ocupado, estudando, trabalhando..." maxlength="40" data-i18n-attr="placeholder:direct.ocupado_estudando_trabalhando"></textarea>
    </div>
    <div class="note-likes" id="noteLikes" hidden>
      <div class="note-likes-title" id="noteLikesTitle"></div>
      <div class="note-likes-list" id="noteLikesList"></div>
    </div>
    <div class="modal-feeling-btns">
      <button class="cancel-feeling-btn" id="cancelNote" data-i18n="common.cancelar">Cancelar</button>
      <button class="send-feeling-btn" id="sendNote" data-i18n="direct.enviar">Enviar</button>
    </div>
  </div>
</div>

<div class="note-view-area" id="viewNoteArea">
  <div class="note-view-overlay" id="viewNoteOverlay"></div>
  <div class="note-view-modal" id="viewNoteModal">
    <div class="user-header">
      <div class="pfp-modal-feeling">
        <img src="./public/img/default.jpg" alt="Foto de perfil" id="noteModalPfp" data-i18n-attr="alt:direct.foto_de_perfil">
      </div>
      <div class="user-info-modal-feeling">
        <div class="note-content-area" id="noteContent">
          <div class="note-content-name" id="noteContentName"></div>
          <div class="note-content" id="noteContentText"></div>
          <div class="note-content-time" id="noteContentTime"></div>
        </div>
      </div>
    </div>

<div class="dm-sheet-area" id="composeSheet" hidden>
  <div class="dm-sheet-overlay" data-sheet-close></div>
  <div class="dm-sheet" role="dialog" aria-modal="true">
    <div class="dm-sheet-header">
      <button class="dm-sheet-text-btn" type="button" data-sheet-close data-i18n="common.cancelar">Cancelar</button>
      <div class="dm-sheet-title" data-i18n="dm.newMessage">Nova mensagem</div>
      <button class="dm-sheet-text-btn primary" id="composeAction" type="button" disabled data-i18n="dm.chat">Conversar</button>
    </div>
    <div class="compose-to">
      <span class="compose-to-label" data-i18n="dm.to">Para:</span>
      <div class="compose-chips" id="composeChips"></div>
      <input class="compose-search" id="composeSearch" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="pesquisar" data-i18n-attr="placeholder:common.pesquisar">
    </div>
    <input class="compose-group-name" id="composeGroupName" type="text" maxlength="50" autocomplete="off" placeholder="Nome do grupo (opcional)" data-i18n-attr="placeholder:dm.groupNamePlaceholder" hidden>
    <div class="compose-hint" id="composeHint"></div>
    <div class="compose-results" id="composeResults"></div>
  </div>
</div>
